# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
PackageIdentifier: Langware.Flowpad
PackageVersion: 0.2.49
InstallerType: nullsoft
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
InstallerSwitches:
  Silent: /S
  SilentWithProgress: /S
UpgradeBehavior: install
# Apps & Features entry as electron-builder's NSIS installer writes it (confirmed on a real
# install 2026-09-14): key = uuid5(ELECTRON_BUILDER_NS_UUID, appId "ai.flowpad.desktop"),
# Publisher comes from package.json "author", DisplayName is "<productName> <version>".
# Only the version-independent fields, so the automated version bumps (winget-releaser /
# Komac) never carry a stale display name or version forward.
AppsAndFeaturesEntries:
  - Publisher: Langware Labs
    ProductCode: '01ea153f-315f-5cd5-8810-48807d21bb7d'
    InstallerType: nullsoft
ReleaseDate: 2026-10-04
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/langware-labs/flowpad/releases/download/v0.2.49/Flowpad-Setup.exe
    InstallerSha256: DD377906C27DA9417699DD98F3A63077B583FC154B718C01D115DD82B8D858EA
ManifestType: installer
ManifestVersion: 1.12.0
